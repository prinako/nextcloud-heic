worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream nextcloud_fpm {
        zone nextcloud_fpm 64k;
        server app:9000 resolve;
    }

    server {
        listen 80 default_server;
        server_tokens off;
        absolute_redirect off;
        root /var/www/html;
        index index.php index.html /index.php$request_uri;

        client_max_body_size 10G;
        client_body_timeout 300s;
        fastcgi_read_timeout 300s;

        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        fastcgi_hide_header X-Powered-By;

        location = /.well-known/caldav { return 301 /remote.php/dav/; }
        location = /.well-known/carddav { return 301 /remote.php/dav/; }
        location ^~ /.well-known/ { return 301 /index.php$request_uri; }
        location /remote { return 301 /remote.php$request_uri; }

        location ^~ /push/ {
            set $push_backend http://notify_push:7867;
            rewrite ^/push/(.*)$ /$1 break;
            proxy_pass $push_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location ~ ^/(?:build|tests|config|lib|3rdparty|templates|data)(?:$|/) { return 404; }
        location ~ ^/(?:\.|autotest|occ|issue|indie|db_|console) { return 404; }

        # Keep PHP handling ahead of static files so WebDAV paths reach Nextcloud.
        location ~ \.php(?:$|/) {
            rewrite ^/(?!index|remote|public|cron|core/ajax/update|status|ocs/v[12]|updater/.+|ocs-provider/.+|.+/richdocumentscode(_arm64)?/proxy) /index.php$request_uri;
            fastcgi_split_path_info ^(.+?\.php)(/.*)$;
            set $path_info $fastcgi_path_info;
            try_files $fastcgi_script_name =404;

            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $path_info;
            fastcgi_param modHeadersAvailable true;
            fastcgi_param front_controller_active true;
            fastcgi_request_buffering on;
            fastcgi_pass nextcloud_fpm;
        }

        location ~ \.mjs$ {
            types { text/javascript mjs; }
            try_files $uri /index.php$request_uri;
        }

        location / {
            try_files $uri $uri/ /index.php$request_uri;
        }
    }
}
