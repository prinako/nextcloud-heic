x-nextcloud-image: &nextcloud-image ${NEXTCLOUD_IMAGE:-ghcr.io/prinako/nextcloud-heic:main}

x-nextcloud-environment: &nextcloud-environment
  TZ: ${TZ:-UTC}
  MYSQL_HOST: db
  MYSQL_DATABASE: ${MYSQL_DATABASE:-nextcloud}
  MYSQL_USER: ${MYSQL_USER:-nextcloud}
  MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
  REDIS_HOST: redis
  REDIS_HOST_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
  NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_TRUSTED_DOMAINS:-localhost}
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
  OVERWRITEPROTOCOL: ${OVERWRITEPROTOCOL:-}
  PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT:-1024M}
  PHP_UPLOAD_LIMIT: ${PHP_UPLOAD_LIMIT:-10G}

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --log-bin=binlog --binlog-format=ROW
    volumes:
      - db:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nextcloud}
      MYSQL_USER: ${MYSQL_USER:-nextcloud}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}", "--appendonly", "yes"]
    volumes:
      - redis:/data
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -qx PONG"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    image: *nextcloud-image
    restart: unless-stopped
    volumes:
      - nextcloud:/var/www/html
    environment:
      <<: *nextcloud-environment
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:-admin}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:?Set NEXTCLOUD_ADMIN_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5m

  web:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NEXTCLOUD_PORT:-8080}:80"
    volumes:
      - nextcloud:/var/www/html:ro
    configs:
      - source: nginx
        target: /etc/nginx/nginx.conf
    depends_on:
      app:
        condition: service_healthy

  cron:
    image: *nextcloud-image
    restart: unless-stopped
    entrypoint: /cron.sh
    volumes:
      - nextcloud:/var/www/html
    environment: *nextcloud-environment
    depends_on:
      app:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["cloudflare"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - web

  notify_push:
    image: *nextcloud-image
    profiles: ["push"]
    restart: unless-stopped
    user: "33:33"
    working_dir: /var/www/html
    entrypoint:
      - /var/www/html/custom_apps/notify_push/bin/${NOTIFY_PUSH_ARCH:-x86_64}/notify_push
      - /var/www/html/config/config.php
    environment:
      <<: *nextcloud-environment
      NEXTCLOUD_URL: http://web
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      PORT: "7867"
    volumes:
      - nextcloud:/var/www/html:ro
    depends_on:
      app:
        condition: service_healthy
      web:
        condition: service_started

  onlyoffice:
    image: onlyoffice/documentserver:9.4.0.1
    profiles: ["onlyoffice"]
    restart: unless-stopped
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-}
      JWT_HEADER: AuthorizationJwt
    ports:
      - "127.0.0.1:${ONLYOFFICE_PORT:-8081}:80"
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_lib:/var/lib/onlyoffice
      - onlyoffice_db:/var/lib/postgresql

configs:
  nginx:
    file: ./nginx/nginx.conf

volumes:
  db:
  redis:
  nextcloud:
  onlyoffice_data:
  onlyoffice_lib:
  onlyoffice_db:
